# Levanta todo con Docker: n8n + Postgres (base propia de n8n) + el pipeline.
#   cp .env.example .env      (y cambia la clave de Postgres)
#   docker compose up -d --build
#   n8n:      http://localhost:5678
#   pipeline: http://localhost:5688/salud
#
# En mi PC corro n8n con Node (npx), sin Docker, porque tengo 16 GB de RAM.
# Este archivo es para quien descargue el repo y para la prueba de GitHub.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Pon POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    restart: unless-stopped
    # PIPELINE_ARGS=--muestra usa los datos ficticios de prueba (lo hace la CI)
    command: ["sh", "-c", "python scripts/servidor.py --host 0.0.0.0 ${PIPELINE_ARGS:-}"]
    volumes:
      - ./datos:/app/datos
      - ./resumenes:/app/resumenes
    ports:
      - "127.0.0.1:5688:5688"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5688/salud')"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      PIPELINE_URL: http://pipeline:5688
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen3.5:9b}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_datos:/home/node/.n8n
      - ./flujos:/flujos:ro
    # n8n tarda en arrancar (migraciones de la base). Sin esto, «docker compose up --wait»
    # no lo espera y la primera llamada falla (pasó en la primera corrida de GitHub Actions).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres_datos:
  n8n_datos:
